name: Code-only checks

on:
  pull_request:
  push:
    branches: [main, fix/idempotent-evaluation-resume]

permissions:
  contents: read

concurrency:
  group: code-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Confirm private runtime artifacts are absent
        run: |
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          forbidden = ('data/', 'models/', 'adapters/', '.local/', '.hf-cache/', '.venv/')
          assert not any(path.startswith(forbidden) for path in files)
          assert not any(path.endswith(('.safetensors', '.gguf', '.sqlite', '.bin')) for path in files)
          PY
      - name: Synthetic contract checks (local corpus test skipped)
        run: python src/checks.py
      - name: Immutable resume regression checks
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q src tests
