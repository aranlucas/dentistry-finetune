name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up patched Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false

      - name: "Website: lint, format, tests and build"
        working-directory: web
        run: npm ci && npm run lint && npm run format:check && npm test && npm run build

      - name: Confirm only the approved dataset snapshot is present
        run: |
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          forbidden = ('data/', 'models/', 'adapters/', '.local/', '.hf-cache/', '.venv/')
          assert not any(path.startswith(forbidden) for path in files)
          assert not any(path.endswith(('.safetensors', '.gguf', '.sqlite', '.bin')) for path in files)
          approved = {'datasets/pilot-v1/' + name for name in
                      ['train.jsonl', 'valid.jsonl', 'heldout.jsonl', 'manifest.json',
                       'INTEGRITY.json', 'DATASET_CARD.md']}
          assert {path for path in files if path.startswith('datasets/')} == approved
          PY

      - name: Synthetic contract checks
        run: python src/checks.py

      - name: Test
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: "Lint: compile source"
        run: python -m compileall -q src tests

      - name: Prove audit regressions detect baseline defects
        run: |
          mkdir -p /tmp/audit-baseline
          git show b618950:src/server.py > /tmp/audit-baseline/server.py
          git show b618950:src/judgment_journal.py > /tmp/audit-baseline/judgment_journal.py
          git show b618950:src/development.py > /tmp/audit-baseline/development.py
          git show b618950:src/grounded.py > /tmp/audit-baseline/grounded.py
          git show b618950:src/curated_dataset.py > /tmp/audit-baseline/curated_dataset.py
          PYTHONPATH=/tmp/audit-baseline:src:tests python - <<'PY'
          import unittest
          from test_server import ServerFailureTests
          from test_judgment_journal import JournalChecks
          from test_development import DevelopmentChecks
          names = [
              ServerFailureTests('test_missing_and_corrupt_saved_results_return_json'),
              ServerFailureTests('test_invalid_run_types_return_json_and_release_inference_slot'),
              JournalChecks('test_concurrent_append_preserves_both_decisions'),
              DevelopmentChecks('test_resume_requires_original_fingerprint_for_both_development_modes'),
              DevelopmentChecks('test_curated_training_rejects_tampered_review_before_loading_tokenizer'),
          ]
          for test in names:
              result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite([test]))
              assert not result.wasSuccessful(), f'Baseline unexpectedly passed {test}'
          PY

      - name: Install pinned e2e browser
        working-directory: web
        run: npx --no-install e2e-web install chromium --with-deps

      - name: Deterministic study journeys (no model credentials)
        working-directory: web
        run: npx --no-install e2e run --reporter list,junit

      - name: Upload browser failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: study-e2e
          path: |
            web/.e2e/report.json
            web/.e2e/junit.xml
            web/.e2e/results
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
